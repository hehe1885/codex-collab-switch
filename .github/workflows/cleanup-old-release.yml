name: Remove superseded v0.4.1 release
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-old-release.yml"]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete superseded release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete v0.4.1 --cleanup-tag --yes
